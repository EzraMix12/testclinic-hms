<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TestClinic HMS</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHZpZXdCb3g9IjAgMCAzMiAzMiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNCIgZmlsbD0iIzBFQTVFOSIvPgo8cGF0aCBkPSJNMTYgNlYyNk0yNiAxNkg2IiBzdHJva2U9IndoaXRlIiBzdHJva2Utd2lkdGg9IjMiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPgo8L3N2Zz4K">
    
    <!-- External Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="design-tokens.js"></script>
    <script src="mobile-nav-fix.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-sky-900 min-h-screen flex items-center justify-center">

    <!-- Login Container -->
    <div class="glass-card max-w-md w-full mx-4 p-8">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="bg-sky-500 text-white p-3 rounded-xl shadow-sm inline-block mb-4">
                <i class="fa-solid fa-house-medical text-2xl"></i>
            </div>
            <h1 class="font-bold text-2xl text-slate-900 dark:text-slate-100">
                Test<span class="text-sky-500">Clinic</span> HMS
            </h1>
            <p class="text-slate-600 dark:text-slate-400 mt-2">Sign in to your account</p>
        </div>

        <!-- Demo Credentials Notice -->
        <div class="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-lg p-4 mb-6">
            <div class="flex items-start space-x-3">
                <i class="fa-solid fa-info-circle text-amber-600 mt-0.5"></i>
                <div>
                    <h3 class="font-semibold text-amber-800 dark:text-amber-200 text-sm">Demo Credentials</h3>
                    <p class="text-amber-700 dark:text-amber-300 text-sm mt-1">
                        Use any of the demo accounts below to explore different role permissions.
                    </p>
                </div>
            </div>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-6">
            <!-- Role Selection -->
            <div>
                <label for="role" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Role</label>
                <select id="role" onchange="updateCredentials()" class="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 dark:text-slate-200 dark:placeholder-slate-400 appearance-none" required>
                    <option value="" class="text-slate-500 dark:text-slate-400 dark:bg-slate-800">Select your role...</option>
                    <option value="doctor" class="text-slate-900 dark:text-slate-200 dark:bg-slate-800">Doctor</option>
                    <option value="receptionist" class="text-slate-900 dark:text-slate-200 dark:bg-slate-800">Receptionist</option>
                    <option value="admin" class="text-slate-900 dark:text-slate-200 dark:bg-slate-800">Admin/Cashier</option>
                </select>
            </div>

            <!-- Username -->
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Username</label>
                <input type="text" id="username" class="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 dark:text-slate-200 dark:placeholder-slate-400" placeholder="Enter username" required>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Password</label>
                <div class="relative">
                    <input type="password" id="password" class="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 dark:text-slate-200 dark:placeholder-slate-400" placeholder="Enter password" required>
                    <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition-colors">
                        <i class="fa-solid fa-eye" id="password-toggle"></i>
                    </button>
                </div>
            </div>

            <!-- Demo Accounts Quick Select -->
            <div class="grid grid-cols-1 gap-3">
                <h4 class="text-sm font-semibold text-slate-700 dark:text-slate-300">Quick Demo Login:</h4>
                
                <button type="button" onclick="selectDemo('doctor')" class="flex items-center justify-between p-3 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 rounded-lg hover:bg-emerald-100 dark:hover:bg-emerald-900/30 transition">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-stethoscope text-emerald-600"></i>
                        <div class="text-left">
                            <div class="font-semibold text-emerald-800 dark:text-emerald-200">Dr. Sarah Jenkins</div>
                            <div class="text-xs text-emerald-600 dark:text-emerald-400">EMR & Consultations</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right text-emerald-600"></i>
                </button>

                <button type="button" onclick="selectDemo('receptionist')" class="flex items-center justify-between p-3 bg-sky-50 dark:bg-sky-900/20 border border-sky-200 dark:border-sky-800 rounded-lg hover:bg-sky-100 dark:hover:bg-sky-900/30 transition">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-user-nurse text-sky-600"></i>
                        <div class="text-left">
                            <div class="font-semibold text-sky-800 dark:text-sky-200">Maria Rodriguez</div>
                            <div class="text-xs text-sky-600 dark:text-sky-400">Queue & Registry</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right text-sky-600"></i>
                </button>

                <button type="button" onclick="selectDemo('admin')" class="flex items-center justify-between p-3 bg-purple-50 dark:bg-purple-900/20 border border-purple-200 dark:border-purple-800 rounded-lg hover:bg-purple-100 dark:hover:bg-purple-900/30 transition">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-chart-line text-purple-600"></i>
                        <div class="text-left">
                            <div class="font-semibold text-purple-800 dark:text-purple-200">Admin Portal</div>
                            <div class="text-xs text-purple-600 dark:text-purple-400">Analytics & Reports</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right text-purple-600"></i>
                </button>
            </div>

            <!-- Login Button -->
            <button type="submit" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-sign-in-alt"></i>
                <span>Sign In</span>
            </button>
        </form>

        <!-- Footer -->
        <div class="text-center mt-6 text-sm text-slate-500 dark:text-slate-400">
            <p>© 2026 TestClinic HMS - Demo Version</p>
        </div>
    </div>

    <!-- Theme Toggle -->
    <div class="fixed top-4 right-4">
        <button id="theme-toggle" 
                class="flex items-center justify-center p-3 rounded-lg bg-white/20 backdrop-blur-sm hover:bg-white/30 transition-colors border border-white/20" 
                aria-label="Toggle theme" 
                title="Toggle theme">
            <i class="fa-solid fa-sun text-lg text-white" id="theme-icon"></i>
        </button>
    </div>

    <script>
        // Demo user accounts
        const demoUsers = {
            doctor: { username: 'dr.jenkins', password: 'doctor123', name: 'Dr. Sarah Jenkins' },
            receptionist: { username: 'maria.r', password: 'reception123', name: 'Maria Rodriguez' },
            admin: { username: 'admin', password: 'admin123', name: 'System Administrator' }
        };

        // Update credentials based on role selection
        function updateCredentials() {
            const role = document.getElementById('role').value;
            const usernameField = document.getElementById('username');
            const passwordField = document.getElementById('password');
            
            if (role && demoUsers[role]) {
                usernameField.value = demoUsers[role].username;
                passwordField.value = demoUsers[role].password;
            }
        }

        // Quick demo login selection
        function selectDemo(role) {
            document.getElementById('role').value = role;
            updateCredentials();
        }

        // Toggle password visibility
        function togglePassword() {
            const passwordField = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle');
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleIcon.className = 'fa-solid fa-eye-slash';
            } else {
                passwordField.type = 'password';
                toggleIcon.className = 'fa-solid fa-eye';
            }
        }

        // Handle login form submission
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const role = document.getElementById('role').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Validate demo credentials
            if (demoUsers[role] && 
                username === demoUsers[role].username && 
                password === demoUsers[role].password) {
                
                // Store user session
                localStorage.setItem('testclinic-user', JSON.stringify({
                    role: role,
                    username: username,
                    name: demoUsers[role].name,
                    loginTime: new Date().toISOString()
                }));
                
                // Redirect based on role
                switch(role) {
                    case 'doctor':
                        window.location.href = 'emr.html';
                        break;
                    case 'receptionist':
                        window.location.href = 'dashboard.html';
                        break;
                    case 'admin':
                        window.location.href = 'analytics.html';
                        break;
                    default:
                        window.location.href = 'dashboard.html';
                }
            } else {
                // Show error
                alert('Invalid credentials. Please use one of the demo accounts.');
            }
        });

        // Initialize theme toggle
        document.addEventListener('DOMContentLoaded', function() {
            // Apply saved theme
            const savedTheme = localStorage.getItem('testclinic-theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-theme');
                document.getElementById('theme-icon').classList.replace('fa-sun', 'fa-moon');
            }
            
            // Theme toggle event
            document.getElementById('theme-toggle').addEventListener('click', function() {
                const html = document.documentElement;
                const icon = document.getElementById('theme-icon');
                
                if (html.classList.contains('dark-theme')) {
                    html.classList.remove('dark-theme');
                    icon.classList.replace('fa-moon', 'fa-sun');
                    localStorage.setItem('testclinic-theme', 'light');
                } else {
                    html.classList.add('dark-theme');
                    icon.classList.replace('fa-sun', 'fa-moon');
                    localStorage.setItem('testclinic-theme', 'dark');
                }
            });
        });
    </script>

    <script src="theme-toggle.js"></script>
</body>
</html>
