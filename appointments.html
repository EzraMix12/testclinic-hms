<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Appointment Calendar - TestClinic HMS</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- External Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Navigation Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="dashboard.html" class="flex items-center space-x-3">
                <div class="bg-sky-500 text-white p-2 rounded-xl shadow-sm">
                    <i class="fa-solid fa-calendar-days text-lg"></i>
                </div>
                <div>
                    <span class="font-bold text-lg text-slate-900 tracking-tight">Appointment Calendar</span>
                </div>
            </a>
            
            <div class="flex items-center space-x-3">
                <button onclick="openBookingModal()" class="bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-plus mr-2"></i>New Appointment
                </button>
                <button onclick="history.back()" class="text-slate-600 hover:text-slate-900 px-3 py-2 rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-arrow-left mr-2"></i>Back
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Calendar Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 space-y-4 sm:space-y-0">
            <div>
                <h1 class="text-2xl font-bold text-slate-900" id="calendar-title">October 2026</h1>
                <p class="text-slate-600">Schedule and manage patient appointments</p>
            </div>
            
            <div class="flex items-center space-x-3">
                <button onclick="previousMonth()" class="p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button onclick="nextMonth()" class="p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
                <button onclick="goToToday()" class="bg-slate-500 hover:bg-slate-600 text-white px-3 py-2 rounded-lg text-sm font-medium transition">
                    Today
                </button>
            </div>
        </div>

        <!-- Calendar Grid -->
        <div class="glass-card p-6">
            <div class="calendar-grid">
                <!-- Day Headers -->
                <div class="calendar-header">
                    <div class="calendar-day-header">Sun</div>
                    <div class="calendar-day-header">Mon</div>
                    <div class="calendar-day-header">Tue</div>
                    <div class="calendar-day-header">Wed</div>
                    <div class="calendar-day-header">Thu</div>
                    <div class="calendar-day-header">Fri</div>
                    <div class="calendar-day-header">Sat</div>
                </div>
                
                <!-- Calendar Days -->
                <div class="calendar-body" id="calendar-body">
                    <!-- Days will be generated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Today's Appointments -->
        <div class="mt-8">
            <h2 class="text-xl font-bold text-slate-900 mb-4">Today's Appointments</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="today-appointments">
                <!-- Today's appointments will be populated here -->
            </div>
        </div>
    </main>

    <!-- Appointment Booking Modal -->
    <div id="booking-modal" class="hidden modal-backdrop">
        <div class="modal-container max-w-md">
            <div class="flex justify-between items-center border-b border-slate-200 pb-4 mb-6">
                <h3 class="font-bold text-slate-900">Schedule Appointment</h3>
                <button onclick="closeBookingModal()" class="text-slate-500 hover:text-slate-700">
                    <i class="fa-solid fa-times text-xl"></i>
                </button>
            </div>
            
            <form id="appointment-form" class="space-y-4">
                <div>
                    <label for="appointment-patient" class="block text-sm font-semibold text-slate-700 mb-2">Patient</label>
                    <select id="appointment-patient" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500" required>
                        <option value="">Select patient...</option>
                    </select>
                </div>

                <div>
                    <label for="appointment-date" class="block text-sm font-semibold text-slate-700 mb-2">Date</label>
                    <input type="date" id="appointment-date" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500" required>
                </div>

                <div>
                    <label for="appointment-time" class="block text-sm font-semibold text-slate-700 mb-2">Time</label>
                    <select id="appointment-time" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500" required>
                        <option value="09:00">9:00 AM</option>
                        <option value="09:30">9:30 AM</option>
                        <option value="10:00">10:00 AM</option>
                        <option value="10:30">10:30 AM</option>
                        <option value="11:00">11:00 AM</option>
                        <option value="11:30">11:30 AM</option>
                        <option value="13:00">1:00 PM</option>
                        <option value="13:30">1:30 PM</option>
                        <option value="14:00">2:00 PM</option>
                        <option value="14:30">2:30 PM</option>
                        <option value="15:00">3:00 PM</option>
                        <option value="15:30">3:30 PM</option>
                        <option value="16:00">4:00 PM</option>
                    </select>
                </div>

                <div>
                    <label for="appointment-doctor" class="block text-sm font-semibold text-slate-700 mb-2">Doctor</label>
                    <select id="appointment-doctor" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500" required>
                        <option value="Dr. Sarah Jenkins">Dr. Sarah Jenkins</option>
                        <option value="Dr. Michael Chen">Dr. Michael Chen</option>
                    </select>
                </div>

                <div>
                    <label for="appointment-purpose" class="block text-sm font-semibold text-slate-700 mb-2">Purpose</label>
                    <select id="appointment-purpose" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500" required>
                        <option value="General Consultation">General Consultation</option>
                        <option value="Follow-up">Follow-up</option>
                        <option value="Medical Certificate">Medical Certificate</option>
                        <option value="Laboratory Results">Laboratory Results</option>
                        <option value="Physical Exam">Physical Exam</option>
                        <option value="Vaccination">Vaccination</option>
                    </select>
                </div>

                <div>
                    <label for="appointment-notes" class="block text-sm font-semibold text-slate-700 mb-2">Notes (Optional)</label>
                    <textarea id="appointment-notes" rows="3" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500" placeholder="Additional notes..."></textarea>
                </div>

                <div class="flex space-x-3 pt-4">
                    <button type="submit" class="flex-1 bg-sky-500 hover:bg-sky-600 text-white font-semibold py-3 px-4 rounded-lg transition">
                        <i class="fa-solid fa-calendar-check mr-2"></i>Schedule
                    </button>
                    <button type="button" onclick="closeBookingModal()" class="flex-1 bg-slate-500 hover:bg-slate-600 text-white font-semibold py-3 px-4 rounded-lg transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let selectedDate = null;
        
        // Sample appointments data
        let appointments = JSON.parse(localStorage.getItem('testclinic-appointments')) || [
            {
                id: 1,
                patientName: 'Juan Dela Cruz',
                date: '2026-10-08',
                time: '10:00',
                doctor: 'Dr. Sarah Jenkins',
                purpose: 'General Consultation',
                status: 'scheduled'
            },
            {
                id: 2,
                patientName: 'Maria Santos',
                date: '2026-10-08',
                time: '14:00',
                doctor: 'Dr. Michael Chen',
                purpose: 'Follow-up',
                status: 'scheduled'
            },
            {
                id: 3,
                patientName: 'Pedro Reyes',
                date: '2026-10-09',
                time: '09:00',
                doctor: 'Dr. Sarah Jenkins',
                purpose: 'Medical Certificate',
                status: 'scheduled'
            }
        ];

        // Initialize calendar
        document.addEventListener('DOMContentLoaded', function() {
            loadPatients();
            generateCalendar();
            loadTodayAppointments();
            setMinDate();
        });

        // Load patients for appointment booking
        function loadPatients() {
            const patients = JSON.parse(localStorage.getItem('pulse_patients')) || [];
            const select = document.getElementById('appointment-patient');
            
            patients.forEach(patient => {
                const option = document.createElement('option');
                option.value = patient.name;
                option.textContent = `${patient.name} (${patient.age} years old)`;
                select.appendChild(option);
            });
        }

        // Set minimum date to today
        function setMinDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('appointment-date').min = today;
        }

        // Generate calendar
        function generateCalendar() {
            const monthNames = [
                "January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"
            ];
            
            document.getElementById('calendar-title').textContent = `${monthNames[currentMonth]} ${currentYear}`;
            
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const today = new Date();
            
            const calendarBody = document.getElementById('calendar-body');
            calendarBody.innerHTML = '';
            
            // Empty cells for days before the first day of the month
            for (let i = 0; i < firstDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'calendar-day empty';
                calendarBody.appendChild(emptyDay);
            }
            
            // Days of the month
            for (let day = 1; day <= daysInMonth; day++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                dayElement.innerHTML = `
                    <div class="day-number">${day}</div>
                    <div class="day-appointments" id="day-${day}-appointments"></div>
                `;
                
                // Highlight today
                if (currentYear === today.getFullYear() && 
                    currentMonth === today.getMonth() && 
                    day === today.getDate()) {
                    dayElement.classList.add('today');
                }
                
                // Add click event
                dayElement.addEventListener('click', () => selectDate(day));
                
                calendarBody.appendChild(dayElement);
                
                // Load appointments for this day
                loadAppointmentsForDay(day);
            }
        }

        // Load appointments for a specific day
        function loadAppointmentsForDay(day) {
            const dayStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const dayAppointments = appointments.filter(apt => apt.date === dayStr);
            
            const appointmentContainer = document.getElementById(`day-${day}-appointments`);
            appointmentContainer.innerHTML = '';
            
            dayAppointments.forEach(appointment => {
                const aptElement = document.createElement('div');
                aptElement.className = 'appointment-item';
                aptElement.innerHTML = `
                    <div class="appointment-time">${formatTime(appointment.time)}</div>
                    <div class="appointment-patient">${appointment.patientName}</div>
                `;
                appointmentContainer.appendChild(aptElement);
            });
        }

        // Format time for display
        function formatTime(time) {
            const [hours, minutes] = time.split(':');
            const hour = parseInt(hours);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const displayHour = hour % 12 || 12;
            return `${displayHour}:${minutes}${ampm}`;
        }

        // Select date
        function selectDate(day) {
            selectedDate = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            document.getElementById('appointment-date').value = selectedDate;
            openBookingModal();
        }

        // Navigation functions
        function previousMonth() {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            generateCalendar();
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            generateCalendar();
        }

        function goToToday() {
            const today = new Date();
            currentMonth = today.getMonth();
            currentYear = today.getFullYear();
            generateCalendar();
        }

        // Load today's appointments
        function loadTodayAppointments() {
            const today = new Date().toISOString().split('T')[0];
            const todayAppointments = appointments.filter(apt => apt.date === today);
            
            const container = document.getElementById('today-appointments');
            container.innerHTML = '';
            
            if (todayAppointments.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center text-slate-500 py-8">No appointments scheduled for today</div>';
                return;
            }
            
            todayAppointments.forEach(appointment => {
                const card = document.createElement('div');
                card.className = 'glass-card p-4';
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <div class="font-semibold text-slate-900">${appointment.patientName}</div>
                        <span class="text-sm bg-sky-100 text-sky-800 px-2 py-1 rounded-full">${formatTime(appointment.time)}</span>
                    </div>
                    <div class="text-sm text-slate-600 mb-2">
                        <i class="fa-solid fa-stethoscope mr-2"></i>${appointment.doctor}
                    </div>
                    <div class="text-sm text-slate-600">
                        <i class="fa-solid fa-clipboard-list mr-2"></i>${appointment.purpose}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Modal functions
        function openBookingModal() {
            document.getElementById('booking-modal').classList.remove('hidden');
            document.body.classList.add('modal-open');
        }

        function closeBookingModal() {
            document.getElementById('booking-modal').classList.add('hidden');
            document.body.classList.remove('modal-open');
            document.getElementById('appointment-form').reset();
        }

        // Handle appointment form submission
        document.getElementById('appointment-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                id: Date.now(),
                patientName: document.getElementById('appointment-patient').value,
                date: document.getElementById('appointment-date').value,
                time: document.getElementById('appointment-time').value,
                doctor: document.getElementById('appointment-doctor').value,
                purpose: document.getElementById('appointment-purpose').value,
                notes: document.getElementById('appointment-notes').value,
                status: 'scheduled'
            };
            
            appointments.push(formData);
            localStorage.setItem('testclinic-appointments', JSON.stringify(appointments));
            
            // Refresh calendar and today's appointments
            generateCalendar();
            loadTodayAppointments();
            
            closeBookingModal();
            
            alert(`✅ Appointment scheduled successfully!\n\nPatient: ${formData.patientName}\nDate: ${formData.date}\nTime: ${formatTime(formData.time)}\nDoctor: ${formData.doctor}`);
        });
    </script>

    <script src="theme-toggle.js"></script>

    <style>
        .calendar-grid {
            display: grid;
            gap: 1px;
            background-color: #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }

        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
        }

        .calendar-day-header {
            background-color: #0ea5e9;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .calendar-body {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
        }

        .calendar-day {
            background-color: white;
            min-height: 120px;
            padding: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .calendar-day:hover {
            background-color: #f8fafc;
        }

        .calendar-day.today {
            background-color: #eff6ff;
            border: 2px solid #0ea5e9;
        }

        .calendar-day.empty {
            background-color: #f8fafc;
            cursor: default;
        }

        .day-number {
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 4px;
            color: #1e293b;
        }

        .day-appointments {
            space-y: 2px;
        }

        .appointment-item {
            background-color: #0ea5e9;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-bottom: 2px;
        }

        .appointment-time {
            font-weight: 600;
        }

        .appointment-patient {
            opacity: 0.9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 768px) {
            .calendar-day {
                min-height: 80px;
                padding: 4px;
            }
            
            .appointment-item {
                font-size: 0.625rem;
                padding: 1px 4px;
            }
        }
    </style>
</body>
</html>
